{% extends "base.html" %}

{% block content %}
<div class="card border-0 shadow-sm col-md-6 mx-auto my-4">
    <div class="card-header bg-info text-white py-3">
        <h4 class="mb-0 fw-bold">Employee Details</h4>
    </div>
    <div class="card-body p-4">
        <ul class="list-group list-group-flush mb-4">
            <li class="list-group-item d-flex justify-content-between">
                <span class="text-secondary fw-semibold">Employee ID</span>
                <span class="fw-bold">#{{ employee.id }}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
                <span class="text-secondary fw-semibold">Name</span>
                <span class="fw-bold">{{ employee.name }}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
                <span class="text-secondary fw-semibold">Email</span>
                <span>{{ employee.email }}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
                <span class="text-secondary fw-semibold">Department</span>
                <span class="badge bg-secondary">{{ employee.department }}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
                <span class="text-secondary fw-semibold">Salary</span>
                <span class="text-success fw-bold">${{ "%.2f"|format(employee.salary) }}</span>
            </li>
        </ul>
        <div class="d-flex gap-2">
            <a href="{{ url_for('employee.employeeUpdate', id=employee.id) }}" class="btn btn-warning px-4">Edit Employee</a>
            <a href="{{ url_for('employee.employee_list') }}" class="btn btn-outline-dark px-4 ms-auto">Back to List</a>
        </div>
    </div>
</div>
{% endblock %}
