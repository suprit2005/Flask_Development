{% extends "base.html" %} 

{% block content %}
<div class="card border-0 shadow-sm col-md-8 mx-auto my-4">
  <div class="card-header bg-warning text-dark py-3">
    <h4 class="mb-0 fw-bold">Update Employee Details</h4>
  </div>

  <div class="card-body p-4">
    <form action="{{ url_for('employee.employeeUpdate', id=employee.id) }}" method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" name="name" value="{{ employee.name }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" name="email" value="{{ employee.email }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" value="{{ employee.password }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Salary ($)</label>
            <input type="number" step="any" min="0" name="salary" value="{{ employee.salary }}" class="form-control" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Department</label>
            <input type="text" name="department" value="{{ employee.department }}" class="form-control" required>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning px-4 fw-bold">Update Record</button>
            <a href="{{ url_for('employee.employee_list') }}" class="btn btn-outline-dark px-4 ms-auto">Cancel</a>
        </div>
    </form>
  </div>
</div>
{% endblock %}
